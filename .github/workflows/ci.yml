name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: "True"
      USE_LOCAL_DB: "True"
      DATABASE_URL: ""
      SUPABASE_DB_URL: ""
      USE_R2_STORAGE: "False"
      REQUIRE_RESUME_SCAN: "False"
      ENABLE_GEMINI_PROCESSING: "False"
      BACKUP_RESTORE_VERIFIED: "True"
      SECURITY_LOG_FORWARDING_CONFIRMED: "True"
      PRIVACY_NOTICE_APPROVED: "True"
      STAGING_ACCEPTANCE_APPROVED: "True"
      CAPACITY_TEST_VERIFIED: "True"
      GEMINI_API_KEY: ""
      THROTTLE_ANON_RATE: 100000/minute
      THROTTLE_USER_RATE: 100000/minute
      THROTTLE_TRACKING_RATE: 20/minute
      THROTTLE_RESUME_APPLY_RATE: 100000/hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: python manage.py test

  deployment-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-random-signing-key-1234567890-abcdefghijklmnopqrstuvwxyz
      SUPABASE_URL: https://example.supabase.co
      ALLOWED_HOSTS: api.example.test
      CORS_ALLOWED_ORIGINS: https://app.example.test
      CSRF_TRUSTED_ORIGINS: https://app.example.test
      SECURE_SSL_REDIRECT: "True"
      ENABLE_DJANGO_ADMIN: "False"
      EDGE_RATE_LIMIT_ENFORCED: "True"
      REQUIRE_RESUME_SCAN: "True"
      USE_R2_STORAGE: "True"
      R2_BUCKET_NAME: ci-private-bucket
      R2_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      ENABLE_GEMINI_PROCESSING: "False"
      BACKUP_RESTORE_VERIFIED: "True"
      SECURITY_LOG_FORWARDING_CONFIRMED: "True"
      PRIVACY_NOTICE_APPROVED: "True"
      STAGING_ACCEPTANCE_APPROVED: "True"
      CAPACITY_TEST_VERIFIED: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate deployment security settings
        run: python manage.py check --deploy --fail-level ERROR
